name: Release (Dev)

on:
  push:
  #workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
      PAYMENT_SYSTEM_API_KEY: ${{ secrets.PAYMENT_SYSTEM_API_KEY}}
      PAYMENT_SYSTEM_TOKEN: ${{ secrets.PAYMENT_SYSTEM_TOKEN}}
      PUBLIC_KEY: ${{ secrets.PAYMENT_SYSTEM_PUBLIC_KEY}}
      PRIVATE_KEY: ${{ secrets.PAYMENT_SYSTEM_PRIVATE_KEY}}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      SENDGRID_SENDER_EMAIL: ${{ secrets.SENDGRID_SENDER_EMAIL }}
      ENV: CI
      TEST_ENV: qqq
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest        
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Prepare and Copy Files
        run: |
          set -x
          tmpdir=$(mktemp -d)
          echo "TMPDIR=$tmpdir" >> $GITHUB_ENV
          cp -r supabase $tmpdir || exit 1
          pushd $tmpdir || exit 1
          rm $tmpdir/supabase/config.toml || exit 1
          mv $tmpdir/supabase/config-test.toml $tmpdir/supabase/config.toml || exit 1
          popd
      - name: Start Supabase and Reset Database
        run: |
          set -x
          pushd $TMPDIR || exit 1
          supabase stop && supabase start && supabase db reset || exit 1
          supabase status -o env >> .supabase-env
          popd
          mv .env .env-dev
          cp .env-test .env-dyn-test
          cat $TMPDIR/.supabase-env >> .env-dyn-test
          mv .env-dyn-test .env
          ls -la
          cat .env
          pytest --cov-report term --cov=lib || exit 1

        
  deploy:
    runs-on: ubuntu-latest
    #needs: test
    if: github.ref == 'refs/heads/master' && ${{ false }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID_DEV }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST_DEV}}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT}}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER_DEV }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Version Spec of the version to use in SemVer notation.
          # It also emits such aliases as lts, latest, nightly and canary builds
          # Examples: 12.x, 10.15.1, >=10.15.0, lts/Hydrogen, 16-nightly, latest, node
          node-version: '18.x'
      - uses: supabase/setup-cli@v1
        with:
          version: latest        
      # - run: |
      #     pushd directus
      #     sed -i "s/^DB_HOST=.*/DB_HOST=$SUPABASE_DB_HOST/" .env
      #     sed -i "s/^DB_PORT=.*/DB_PORT=$SUPABASE_DB_PORT/" .env
      #     sed -i "s/^DB_DATABASE=.*/DB_DATABASE=$SUPABASE_DB_DATABASE/" .env
      #     sed -i "s/^DB_USER=.*/DB_USER=$SUPABASE_DB_USER/" .env
      #     sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$SUPABASE_DB_PASSWORD/" .env
      #     cat .env

      #     npm i
      #     popd
      - run: supabase link --project-ref $SUPABASE_PROJECT_ID
      - run: supabase db push
      # - run: ./directus-apply-snapshot
